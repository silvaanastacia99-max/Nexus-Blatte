<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus-Blatte</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      text-align: center;
    }

    header {
      padding: 50px 20px;
      background: linear-gradient(135deg, #17172b, #3b176b);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    p {
      font-size: 18px;
      color: #ddd;
    }

    .botao {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      border-radius: 10px;
      background: #7c3cff;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .secao {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: #171722;
      border-radius: 15px;
    }

    footer {
      padding: 25px;
      color: #999;
    }
  </style>
</head>

<body>

  <header>
    <h1>Nexus-Blatte</h1>
    <p>Bem-vindo ao meu projeto!</p>
    <a class="botao" href="#projeto">Conhecer o projeto</a>
  </header>

  <section class="secao" id="projeto">
    <div class="card">
      <h2>Meu Projeto</h2>
      <p>
        Este é o site oficial do projeto Nexus-Blatte.
      </p>
    </div>
  </section>

  <footer>
    © 2026 Nexus-Blatte
  </footer>

</body>
</html>
